    category:
      name: Category
      selector:
        select:
          options:
          - general
          - doorbell
          - camera
          - alarm
          - media
          - announcement
          - reminder
          - system
          custom_value: true
    all:
      name: All
      selector:
        boolean: {}
    entity_id:
      name: TV notification entities
      description: Select by entity name instead of TV device.
      selector:
        entity:
          integration: herald
          domain: notify
          multiple: true
