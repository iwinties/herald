show_card:
  name: Show card
  description: Display text, buttons, an image or live video over the current TV app.
  fields:
    device_id:
      name: TVs
      selector:
        device:
          integration: herald
          multiple: true
      description: Omit all targets to use every connected TV. Spoken cards also reach configured speakers.
    id:
      name: ID
      selector:
        text: {}
    category:
      name: Category
      selector:
        select:
          options:
          - general
          - doorbell
          - camera
          - alarm
          - media
          - announcement
          - reminder
          - system
          custom_value: true
    title:
      name: Title
      selector:
        text: {}
    message:
      name: Message
      selector:
        text: {}
    from:
      name: From
      selector:
        text: {}
    buttons:
      name: Buttons
      selector:
        object: {}
    image:
      name: Image
      selector:
        object: {}
    video:
      name: Video
      selector:
        object: {}
    style:
      name: Style
      selector:
        object: {}
    priority:
      name: Priority
      selector:
        select:
          options:
          - low
          - normal
          - high
          - critical
    icon:
      name: Icon
      selector:
        text: {}
    speakers:
      name: Cast speakers
      selector:
        entity:
          domain: media_player
          multiple: true
    request_id:
      name: Request ID
      selector:
        text: {}
      description: Optional. Reuse for retries of the same announcement.
    volume:
      name: TV announcement volume
      selector:
        number:
          min: 0
          max: 100
    urgent:
      name: Urgent
      selector:
        boolean: {}
    output:
      name: TV audio output
      selector:
        select:
          options:
          - auto
          - tv
          - speaker
    tts:
      name: Text-to-speech voice
      selector:
        entity:
          domain: tts
    language:
      name: Language
      selector:
        text: {}
    options:
      name: Options
      selector:
        object: {}
    chime:
      name: Play a chime first
      selector:
        boolean: {}
      description: For a custom TV chime, use clip:<key> in YAML.
    duck:
      name: Lower other audio during playback
      selector:
        boolean: {}
    announce:
      name: Speak this card aloud
      selector:
        boolean: {}
    announce_text:
      name: Text to speak
      selector:
        text: {}
    announce_timing:
      name: When to show the card
      selector:
        select:
          options:
          - with_voice
          - now
    look:
      name: Look
      selector:
        select:
          options:
          - classic
          - glass
          - minimal
          - banner
          - alert
          - pill
          custom_value: true
    entity_id:
      name: TV notification entities
      description: Select by entity name instead of TV device.
      selector:
        entity:
          integration: herald
          domain: notify
          multiple: true
clear_card:
  name: Clear card
  description: Remove a card by ID, category, or all cards.
  fields:
    device_id:
      name: TVs
      selector:
        device:
          integration: herald
          multiple: true
      description: Leave both TV fields empty to use every connected TV.
    id:
      name: ID
      selector:
        text: {}
    category:
      name: Category
      selector:
        select:
          options:
          - general
          - doorbell
          - camera
          - alarm
          - media
          - announcement
          - reminder
          - system
          custom_value: true
    all:
      name: All
      selector:
        boolean: {}
    entity_id:
      name: TV notification entities
      description: Select by entity name instead of TV device.
      selector:
        entity:
          integration: herald
          domain: notify
          multiple: true
set_chip:
  name: Set status chip
  description: Show or update a persistent status indicator.
  fields:
    device_id:
      name: TVs
      selector:
        device:
          integration: herald
          multiple: true
      description: Leave both TV fields empty to use every connected TV.
    id:
      name: ID
      selector:
        text: {}
    text:
      name: Text
      selector:
        text: {}
    priority:
      name: Priority
      selector:
        select:
          options:
          - normal
          - high
    color:
      name: Color
      selector:
        text: {}
    icon:
      name: Icon
      selector:
        text: {}
    expires:
      name: Clear after (seconds)
      selector:
        number:
          min: 0
          max: 604800
      description: Use 0 to keep the indicator until cleared.
    look:
      name: Look
      selector:
        select:
          options:
          - classic
          - glass
          - minimal
          - banner
          - alert
          - pill
          custom_value: true
    position:
      name: Position
      selector:
        select:
          options:
          - top_left
          - top
          - top_right
          - bottom_left
          - bottom
          - bottom_right
    entity_id:
      name: TV notification entities
      description: Select by entity name instead of TV device.
      selector:
        entity:
          integration: herald
          domain: notify
          multiple: true
