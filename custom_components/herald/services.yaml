save_look:
  name: Save Look
  description: Create or replace a custom Look on the selected TVs.
  fields:
    device_id:
      name: TVs
      selector:
        device:
          integration: herald
          multiple: true
      description: Leave both TV fields empty to use every connected TV.
    id:
      name: ID
      required: true
      selector:
        text: {}
    style:
      name: Style
      required: true
      selector:
        object:
          fields:
            transition_in: *herald_transition_in
            transition_out: *herald_transition_out
            attention_animation: *herald_attention_animation
            transition_expand: *herald_transition_expand
            transition_minimize: *herald_transition_minimize
            text_animation: *herald_text_animation
            ticker_speed: *herald_ticker_speed
            edge_margin: *herald_edge_margin
            placement: *herald_placement
            size: *herald_size
            text_size: *herald_text_size
            layout: *herald_layout
            corner: *herald_corner
            background: *herald_background
            opacity: *herald_opacity
            border: *herald_border
            border_color: *herald_border_color
            shadow: *herald_shadow
            glow: *herald_glow
            accent_style: *herald_accent_style
            title_color: *herald_title_color
            text_color: *herald_text_color
            title_weight: *herald_title_weight
            label: *herald_label
            button_style: *herald_button_style
            button_shape: *herald_button_shape
            button_spacing: *herald_button_spacing
            button_background: *herald_button_background
            button_text_color: *herald_button_text_color
            button_focus_background: *herald_button_focus_background
            button_focus_text_color: *herald_button_focus_text_color
            animation: *herald_animation
    name:
      name: Name
      selector:
        text: {}
    entity_id:
      name: TV notification entities
      description: Select by entity name instead of TV device.
      selector:
        entity:
          integration: herald
          domain: notify
          multiple: true
